[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-core"
version = "0.1.0"
description = "Shared preprocessing for the online and offline branches: language, anonymization, chunking, skills."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["hr_core*"]
