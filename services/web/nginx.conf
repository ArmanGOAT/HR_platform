# web: serves the interface and forwards /api/* to the gateway (docs/ARCHITECTURE.md, 5.1)
server {
    listen 80;
    client_max_body_size 50m;

    # Docker's internal DNS. With a variable in proxy_pass nginx re-resolves "gateway"
    # at request time (cached 10 s), so a recreated gateway container with a new IP
    # does not cause 502 errors. Without it nginx keeps the IP it saw at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream http://gateway:8000;

    location /api/ {
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
